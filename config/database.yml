# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: postgresql
  encoding: unicode
  database: bus_booking_development
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: bus_booking_user
  password: Postgres@123
  host: localhost
  timeout: 5000

development:
  <<: *default
  database: bus_booking_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: bus_booking_test

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *default
    username: bus_booking
    password: <%= ENV["BUS_BOOKING_DATABASE_PASSWORD"] %>
    database: bus_booking_primary
  cache:
    <<: *default
    database: bus_booking_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: bus_booking_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: bus_booking_cable
    migrations_paths: db/cable_migrate
